name: Build CGO latest image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: cgo-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out image repository
        uses: actions/checkout@v5

      - name: Resolve upstream image and plugin release
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_IMAGE: ghcr.io/caidaoli/cliproxyapi:latest
        run: |
          set -euo pipefail
          docker pull "${UPSTREAM_IMAGE}"
          upstream_revision=$(docker image inspect "${UPSTREAM_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          upstream_version=$(docker image inspect "${UPSTREAM_IMAGE}" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          upstream_digest=$(docker image inspect "${UPSTREAM_IMAGE}" --format '{{index .RepoDigests 0}}')
          plugin_tag=$(gh api repos/KKKKeybird/cpa-codex-auto-ping/releases/latest --jq .tag_name)
          build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "upstream_revision=${upstream_revision}" >> "${GITHUB_OUTPUT}"
          echo "upstream_version=${upstream_version}" >> "${GITHUB_OUTPUT}"
          echo "upstream_digest=${upstream_digest}" >> "${GITHUB_OUTPUT}"
          echo "plugin_tag=${plugin_tag}" >> "${GITHUB_OUTPUT}"
          echo "plugin_version=${plugin_tag#v}" >> "${GITHUB_OUTPUT}"
          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"

      - name: Check out matching upstream source
        uses: actions/checkout@v5
        with:
          repository: caidaoli/CLIProxyAPI
          ref: ${{ steps.versions.outputs.upstream_revision }}
          path: upstream

      - name: Check out latest Codex Auto Ping release
        uses: actions/checkout@v5
        with:
          repository: KKKKeybird/cpa-codex-auto-ping
          ref: ${{ steps.versions.outputs.plugin_tag }}
          path: plugin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kkkkeybird/cliproxyapi-cgo:latest
            ghcr.io/kkkkeybird/cliproxyapi-cgo:${{ steps.versions.outputs.upstream_version }}
          build-args: |
            VERSION=${{ steps.versions.outputs.upstream_version }}-cgo
            COMMIT=${{ steps.versions.outputs.upstream_revision }}
            BUILD_DATE=${{ steps.versions.outputs.build_date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/KKKKeybird/cliproxyapi-cgo
            org.opencontainers.image.revision=${{ steps.versions.outputs.upstream_revision }}
            io.kkkkeybird.plugin.codex-auto-ping.version=${{ steps.versions.outputs.plugin_version }}
